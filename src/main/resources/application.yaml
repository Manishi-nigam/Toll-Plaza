# Application configuration
spring:
  application:
    name: toll-plaza-finder

  # Neon PostgreSQL configuration
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    connection-timeout: 30000
    validation-timeout: 5000
    maximum-pool-size: 3
    minimum-idle: 0

  # JPA configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  # In-memory Cache configuration (30-minute expiration)
  cache:
    type: caffeine
    cache-names:
      - route-toll-plazas
    caffeine:
      spec: expireAfterWrite=30m

ors:
  api:
    key: ${ORS_API_KEY}


